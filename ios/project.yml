# XcodeGen 스펙. .xcodeproj 는 `xcodegen generate` 로 언제든 다시 만든다 — wordflow/ios 와 같은 방식.
name: Storyflow
options:
  bundleIdPrefix: com.slstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: DX4YLNP9RK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    # 올릴 때마다 하나씩 올린다. 안 올리면 App Store Connect 가 거절한다.
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"

targets:
  Storyflow:
    type: application
    platform: iOS
    sources:
      - path: Storyflow
      # 워치 앱과 같이 쓰는 낭독 플레이어 (워치가 리모컨일 때 폰이 직접 튼다).
      - path: Shared
    # 챕터 낭독을 켜 두고 화면을 끄는 게 기본 사용법이다. 이게 없으면 화면이 꺼지는 순간 멎는다.
    # `INFOPLIST_KEY_UIBackgroundModes` 로는 안 된다 — Xcode 가 모르는 키는 조용히 버리므로
    # 배열로 주는 이 키는 파일에 직접 적는다 (wordflow/ios 참고).
    info:
      path: Storyflow/Info.plist
      properties:
        UIBackgroundModes: [audio]
        # 오프라인 저장(웹앱의 service worker, public/sw.js)은 WKWebView 에서 App-Bound Domain 으로
        # 선언한 주소에서만 켜진다. StoryflowWebView 의 limitsNavigationsToAppBoundDomains 와 짝.
        WKAppBoundDomains: [storyflow-pied.vercel.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slstudio.storyflow
        PRODUCT_NAME: Storyflow
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Storyflow
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # 아이폰은 세로 그대로. 아이패드는 네 방향 전부 — 하나라도 빠지면 업로드가 거절된다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # 아이폰 + 아이패드 (2026-11-07). 화면은 웹앱이 max-w-2xl(672pt) 가운데 칼럼으로 그려서
        # 아이패드에서도 늘어지지 않는다.
        TARGETED_DEVICE_FAMILY: "1,2"
        # 없으면 업로드할 때마다 수출 규정 질문을 손으로 답해야 한다.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # 애플워치 앱을 아이폰 앱 안에 같이 넣어 올린다 (TestFlight 로 폰에 깔면 워치에도 깔 수 있다).
    dependencies:
      - target: StoryflowWatch

  # 애플워치 앱 (2026-11-13). 폰 없이도 워치 + 에어팟으로 이어 듣기. 낭독 mp3 는 웹과 같은 서버 캐시를 쓴다.
  StoryflowWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StoryflowWatch
      - path: Shared
    info:
      path: StoryflowWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.slstudio.storyflow
        # 화면이 꺼져도 계속 들리게.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slstudio.storyflow.watchkitapp
        PRODUCT_NAME: Storyflow
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Storyflow
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
